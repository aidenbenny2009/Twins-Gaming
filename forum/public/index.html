const WL=[];
function wikiAns(q){const w=(q.toLowerCase().match(/[a-z0-9]+/g)||[]).filter(x=>x.length>2);const E=[...S.wiki,...S.cats.flatMap(c=>c.f.map(f=>({q:'Where is '+f.n,kw:f.n,a:`${f.n}: ${f.d}. Open it from the forum home.`}))),...S.cfg.links.map(l=>({q:l.n,kw:l.n,a:`${l.n}: ${l.u}`}))];
let b=null,bs=0;E.forEach(e=>{const h=(e.q+' '+e.kw+' '+e.a).toLowerCase();const sc=w.filter(x=>h.includes(x)).length;if(sc>bs){bs=sc;b=e}});return b?b.a:"I don't have an answer for that yet. Try the Contact us page, the Discord link, or ask staff to add it to TG WIKI."}
function wiki(){return `<div class="card"><h3>TG WIKI — ask anything about ${esc(S.cfg.name)}</h3><div class="mu" style="padding:0 16px 8px">Answers come from the editable wiki entries, forums and links of this site.</div>${WL.map(m=>`<div class="bubble ${m.r==='u'?'bu':'bb'}">${esc(m.t)}</div>`).join('')}<div class="f"><input id="wq" style="flex:1" placeholder="e.g. how do I appeal a ban?" onkeydown="if(event.key==='Enter')ask()"><button onclick="ask()">Ask</button></div><div class="f">${S.wiki.slice(0,5).map(e=>`<button class="s" onclick="wq.value=this.textContent;ask()">${esc(e.q)}</button>`).join('')}</div></div>`}
function ask(){const q=wq.value.trim();if(!q)return;WL.push({r:'u',t:q},{r:'b',t:wikiAns(q)});render()}
O.wiki=()=>`<div class="card"><h3>TG WIKI entries</h3>${S.wiki.map((e,i)=>`<div class="row" style="display:block">${inp(e.q,`(v=>eW(${i},'q',v))`,'width:100%')}${inp(e.kw,`(v=>eW(${i},'kw',v))`,'width:100%;margin-top:4px')}<textarea onchange="eW(${i},'a',this.value)">${esc(e.a)}</textarea><button class="d" onclick="S.wiki.splice(${i},1);save();render()">Remove</button></div>`).join('')}<div class="f"><button onclick="S.wiki.push({q:'New question',kw:'keywords',a:'Answer'});save();render()">+ Entry</button></div></div>`;
O.pages=()=>['contact','terms','privacy','help'].map(k=>`<div class="card"><h3>${k}</h3><div class="f"><textarea onchange="S.pages['${k}']=this.value;save()">${esc(S.pages[k]||DEF[k])}</textarea></div></div>`).join('');
const eW=(i,k,v)=>ed(()=>S.wiki[i][k]=v);
const ed=(fn)=>{fn();save();render()};
var eCfg=(k,v)=>{log('SETTINGS_CHANGE',k,v);ed(()=>S.cfg[k]=v)};
var eLink=(id,k,v)=>{log('LINK_CHANGE',k,v);ed(()=>S.cfg.links.find(l=>l.id===id)[k]=v)};
var dLink=id=>{log('LINK_DELETE',id);ed(()=>S.cfg.links=S.cfg.links.filter(l=>l.id!==id))};
var aLink=()=>{if(ln.value&&lu.value){log('LINK_ADD',ln.value);ed(()=>S.cfg.links.push({id:uid(),n:ln.value,u:lu.value}))}};
var eCat=(id,v)=>ed(()=>S.cats.find(c=>c.id===id).n=v);
const dCat=id=>{if(confirm('Delete category and its forums?')){log('CATEGORY_DELETE',id);ed(()=>S.cats=S.cats.filter(c=>c.id!==id))}};
var aCat=()=>{log('CATEGORY_ADD','');ed(()=>S.cats.push({id:uid(),n:'New category',f:[]}))};
const aF=cid=>ed(()=>S.cats.find(c=>c.id===cid).f.push({id:uid(),n:'New forum',d:'Description'}));
const eF=(id,k,v)=>ed(()=>fById(id)[k]=v);
const dF=id=>{if(confirm('Delete forum?')){log('FORUM_DELETE',id);ed(()=>{S.cats.forEach(c=>c.f=c.f.filter(f=>f.id!==id));S.threads=S.threads.filter(t=>t.fid!==id)})}};
const eR=(id,k,v)=>{log('ROLE_CHANGE',id,k+'='+v);ed(()=>S.roles.find(r=>r.id===id)[k]=v)};
const tP=(id,p)=>{log('PERMISSION_CHANGE',id,p);ed(()=>{const r=S.roles.find(r=>r.id===id);r.perms=r.perms.includes(p)?r.perms.filter(x=>x!==p):[...r.perms,p]})};
const aR=()=>{log('ROLE_ADD','');ed(()=>S.roles.splice(S.roles.length-1,0,{id:uid(),n:'New role',c:'#3498db',perms:['VIEW_FORUM']}))};
const dR=id=>{if(confirm('Delete role? Users revert to Member.')){log('ROLE_DELETE',id);ed(()=>{S.users.forEach(u=>{if(u.role===id)u.role='member'});S.roles=S.roles.filter(r=>r.id!==id)})}};
const sRole=(id,r)=>{const u=S.users.find(x=>x.id===id);log('ROLE_ASSIGN',u.n,r);ed(()=>u.role=r)};
const ban=id=>{const u=S.users.find(x=>x.id===id);const r=u.ban?'':prompt('Ban reason?')||'';log(u.ban?'UNBAN':'BAN',u.n,r);ed(()=>u.ban=!u.ban)};
const eP=(i,k,v)=>ed(()=>S.prefixes[i][k]=v);
init();S.users.forEach(u=>{if(u.verified===undefined)u.verified=true});

function tixSet(id,k,v){const t=S.tix.find(x=>x.id===id);log('TICKET_'+k.toUpperCase(),t.subj,v);ed(()=>{t[k]=v;if(k==='status'){t.hist.push({t:Date.now(),s:v,by:me().n});notify(t.by,`Your ticket "${t.subj}" is now: ${v}`)}})}

function shrink(f,maxW,maxB,cb){if(!f)return;if(!/^image\//.test(f.type))return alert('Images only.');if(f.size>12e6)return alert('Max 12 MB per image.');const r=new FileReader();r.onload=()=>{if(f.size<=maxB)return cb(r.result);const im=new Image();im.onload=()=>{let w=im.width,h=im.height;if(w>maxW){h=Math.round(h*maxW/w);w=maxW}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);let q=.9,o;do{o=c.toDataURL('image/jpeg',q);q-=.1}while(o.length*.75>maxB&&q>.2);if(o.length*.75>maxB)return alert('Image is too large even after compression.');cb(o)};im.onerror=()=>alert('Could not read that image.');im.src=r.result};r.readAsDataURL(f)}

function fThreads(f){let ts=S.threads.filter(t=>t.fid===f.id);const now=Date.now(),W={day:864e5,week:6048e5,month:2592e6,year:31536e6};
if(FL.pre)ts=ts.filter(t=>t.pre===FL.pre);if(FL.by)ts=ts.filter(t=>((U(t.posts[0].a)||{}).n||'').toLowerCase().includes(FL.by.toLowerCase()));if(FL.when)ts=ts.filter(t=>now-t.last<=W[FL.when]);

const G41=`[b]Welcome![/b]
If you believe you've been penalized unfairly or want to appeal a punishment, this guide will help you file a proper complaint post on our forum. Please read carefully and follow each step to ensure your complaint is considered.

Most likely you are here because a staff member reminded you how to correctly post, because your post was in the incorrect format or violated the rules of filing a complaint.

[h]Step 1: Prepare Your Evidence[/h]
• Take clear screenshots of the penalty or situation.
• Upload screenshots to imgur.com, yapx.ru or imgbb.com.
• If you have video evidence, upload it to youtube.com.
• Do [b]not[/b] crop or edit your evidence.
[b][i]Deceiving on purpose in a complaint may lead to severe consequences up to a blacklist.[/i][/b]

[h]Step 2: Gather Required Information[/h]
Have the following details ready:
• [b]Your ID:[/b] Your in-game ID
• [b]Player's nickname:[/b] Your in-game name
• [b]Administrator's nickname:[/b] The admin who issued the penalty
• [b]Date:[/b] When the penalty occurred
• [b]Time:[/b] Exact time of the incident
• [b]Proofs:[/b] Direct links to your uploaded screenshots/videos

[h]Step 3: Create Your Complaint Topic[/h]
• Go to the correct forum section for complaints.
• Click "Post thread".

[h]Title Format[/h]
Your topic title must briefly describe the problem and include the administrator's nickname.
Like: [i]Punishment-Type for What-You-Are-Punished-For | Name-Of-Administrator[/i]
Examples:
• Demorgan for DM | Crazy Moore
• Warn for SK | Mazhor Pluxury
• Ban for Cheats | Bublik Carrizo
[b][i]It is very important to do this correctly![/i][/b]

[h]Step 4: Fill Out the Complaint Form[/h]
Copy and paste the following template into your post, filling in your details:
• Your ID: Your Player ID
• Player's nickname: Your Nickname
• Administrator's nickname: Administrator who punished you
• Date: Date when the rule break happened
• Time: Time when the rule break happened
• Proofs: Link to your proof
[b][i]Without this information we cannot help you and it is an instant reject![/i][/b]

[h]Step 5: Attach Your Evidence[/h]
• Paste the direct links to your screenshots or videos under "Proofs".
• Do [b]not[/b] use excessive BB codes or formatting.
• Do [b]not[/b] attach files directly; always use approved image/video hosts.

[h]Step 6: Shortly explain your complaint[/h]
• In some short sentences explain the problem that occurred:
   – Why do you make this complaint?
   – What happened?
• If you give a log or POV, tell us the timestamps of when the violation happened.
• If you seek forgiveness, explain why we should forgive you ("I didn't know" is no excuse).

[h]Step 7: Review and Submit[/h]
• Double-check all information for accuracy.
• Make sure your evidence is accessible and unedited. Especially for videos on YouTube, make sure they are not set to private!
• Ensure your post is respectful and free of insults or provocations.
Remember the rules:
• Only post if you are directly involved in the situation.
• Do not spam multiple complaint topics.
• Insults or provocations will result in your complaint being rejected and may lead to a ban.
• Use only the specified image/video hosts.
• Excessive use of BB codes is not allowed.
• The complaint is fully in English, no other languages are in the complaint and the violation is fully understandable in English.
• Submit your complaint.`;
const Q41=`[h]Q&A[/h]
[b]Q: What happens if I don't follow the template?[/b]
A: Your complaint may be refused without review.

[b]Q: Can I comment on someone else's complaint?[/b]
A: No, only those directly involved may participate.

[b]Q: What if my evidence is on another site?[/b]
A: Only imgur.com, yapx.ru, imgbb.com (for images) and youtube.com (for videos) are accepted.

[b]Q: Can I file a complaint after 2 days?[/b]
A: Usually not, unless there are exceptional circumstances. Spamming may lead to punishments.

[b]Q: What if I don't have proof?[/b]
A: Complaints without proof are unlikely to succeed. The minimum requirement is a screenshot of your ban.

[b]Q: Can I use fancy formatting?[/b]
A: No, keep formatting simple; excessive BB codes are not allowed. Don't make your text big or style it in colour.`;
